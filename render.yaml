version: "1"

services:
  # 1. Backend API (Go)
  - type: web
    name: agriculturist-backend
    env: go
    buildCommand: cd backend && go build -o api ./cmd/api
    startCommand: ./backend/api
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_ADDR
        value: ":10000"
      - key: DATABASE_URL
        fromDatabase:
          name: agriculturist-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agriculturist-redis
          property: connectionString
      # ใส่ตัวแปร LINE และ API ที่เหลือผ่าน Dashboard เพื่อความปลอดภัย
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend (Vite Static Site)
  - type: web
    name: agriculturist-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agriculturist-backend
          property: host

  # 3. Cache (Redis)
  - type: redis
    name: agriculturist-redis
    plan: free
    ipAllowList: []

databases:
  # 4. Database (PostgreSQL with PostGIS)
  - name: agriculturist-db
    databaseName: agriculturist
    user: agriculturist
    plan: free
    postgresMajorVersion: 15
